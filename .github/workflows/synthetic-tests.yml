name: Synthetic financial invariants

on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run data-independent tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
